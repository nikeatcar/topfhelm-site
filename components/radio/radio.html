<div id="radio-player">

    <div class="radio-left">

    <div class="radio-cover">
        <img id="radio-cover" src="" alt="" data-lightbox>
    </div>

    <div class="radio-links">

        <a id="shop-link"
           class="radio-link"
           target="_blank"
           rel="noopener"
           title="Shop">🛒</a>

        <a id="bandcamp-link" class="radio-link" target="_blank" rel="noopener">
        <img src="../icons/icons8-bandcamp.svg" alt="Bandcamp">
    </a>

    <a id="spotify-link" class="radio-link" target="_blank" rel="noopener">
        <img src="../icons/icons8-spotify.svg" alt="Spotify">
    </a>

    </div>

</div>

    <div class="radio-center">

        <div id="radio-track"></div>

        <div id="radio-album"></div>

        <div class="radio-progress">

            <span id="current-time">0:00</span>

            <input
                type="range"
                id="progress"
                min="0"
                max="100"
                value="50">

            <span id="duration">0:00</span>

        </div>

    </div>

    <div class="radio-right">

        <div class="radio-controls">

            <button id="prev-btn" class="radio-btn">⏮</button>

            <button id="play-btn" class="radio-btn">▶</button>

            <button id="next-btn" class="radio-btn">⏭</button>

        </div>

        <div class="radio-volume">

    <span class="volume-label">VOL</span>

    <input
        type="range"
        id="volume"
        min="0"
        max="1"
        step="0.01"
        value="0.5">

</div>

    </div>

    <audio id="audio"></audio>

</div>
