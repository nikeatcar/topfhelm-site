[[redirects]]
from = "/en"
to = "/index.html"
status = 200
force = true

[[redirects]]
from = "/ru"
to = "/index-ru.html"
status = 200
force = true

[[redirects]]
from = "/the-emerald-saga"
to = "/the-emerald-saga/index.html"
