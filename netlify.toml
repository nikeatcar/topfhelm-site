# ==========================================================
# Netlify
# ==========================================================

[build]
publish = "/"
command = ""


# ==========================================================
# Global headers
# ==========================================================

[[headers]]
for = "/*"

[headers.values]

Accept-Encoding = "gzip, br"

Content-Security-Policy = "default-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://code.jquery.com https://cdnjs.cloudflare.com https://www.googletagmanager.com https://www.youtube.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' https://cdn.topfhelm.com; connect-src 'self' https://cdn.topfhelm.com https://region1.google-analytics.com https://www.google-analytics.com https://stats.g.doubleclick.net https://www.googletagmanager.com https://cloudflareinsights.com; frame-src 'self' https://open.spotify.com https://www.youtube.com https://bandcamp.com;"

Link = "</llms.txt>; rel=\"alternate\"; type=\"text/plain\", </llms-full.txt>; rel=\"alternate\"; type=\"text/plain\", </sitemap.xml>; rel=\"sitemap\"; type=\"application/xml\""

Referrer-Policy = "strict-origin-when-cross-origin"
Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"


# ==========================================================
# HTML cache
# ==========================================================

[[headers]]
for = "/"

[headers.values]
Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
for = "/*.html"

[headers.values]
Cache-Control = "public, max-age=300, must-revalidate"


# ==========================================================
# CSS
# ==========================================================

[[headers]]
for = "/styles/*.css"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/dungeon-synth-artists/*.css"

[headers.values]
Cache-Control = "public, max-age=3600, must-revalidate"

# ==========================================================
# JS
# ==========================================================

[[headers]]
for = "/components/radio/*.js"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/components/footer/*.js"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/components/contact/*.js"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/data/artists.json"

[headers.values]
Cache-Control = "public, max-age=300, must-revalidate"

# ==========================================================
# Fonts
# ==========================================================

[[headers]]
for = "/fonts/*.woff2"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"


# ==========================================================
# Images / Media
# ==========================================================

[[headers]]
for = "/media/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"


# ==========================================================
# Redirects
# ==========================================================

[[redirects]]
from = "/shop.html"
to = "/shop"
status = 301
force = true

[[redirects]]
from = "/index.html"
to = "/"
status = 301
force = true

[[redirects]]
from = "/index-ru.html"
to = "/ru"
status = 301
force = true

[[redirects]]
from = "/the-emerald-saga/index.html"
to = "/the-emerald-saga"
status = 301
force = true

[[redirects]]
from = "/the-emerald-saga/index-ru.html"
to = "/the-emerald-saga/ru"
